services:
  app:
    build:
      context: ./docker/php-fpm
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - db

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: db_genbi
      POSTGRES_USER: genbi_postgres
      POSTGRES_PASSWORD: genbi_postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: abyalaxx@gmail.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
    - "8082:80"
    depends_on:
    - db

  vite:
    image: node:20-alpine
    working_dir: /var/www/html
    command: ["pnpm", "run", "dev", "--host"]
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
    entrypoint: ["sh", "-c", "npm install -g pnpm && pnpm install && pnpm run dev --host"]



volumes:
  pgdata:
