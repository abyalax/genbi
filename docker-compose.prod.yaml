version: '3.8'
services:
  genbi-psql:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: genbipostgres
      POSTGRES_USER: genbipostgres
      POSTGRES_DB: genbipostgres
    ports:
      - "5432:5432"

  php:
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
    image: genbi-php-fpm
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      - genbi-psql

  web:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

volumes:
  pgdata:
    name: genbi_pgdata

